[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes while letting
# real static assets (sitemap.xml, robots.txt, images) resolve first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache immutable, fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always let crawlers re-fetch the entry document, robots and sitemap.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Baseline security headers (also a minor trust signal for crawlers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

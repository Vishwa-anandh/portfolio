<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================= -->
    <!-- GLOBAL META                                                    -->
    <!-- Per-page tags (title, description, canonical, Open Graph,      -->
    <!-- Twitter) are set per-route by the <Seo> component and baked    -->
    <!-- into every route's static HTML at build time by the prerender  -->
    <!-- step (scripts/prerender.mjs). Only site-wide tags live here to -->
    <!-- avoid duplicate/conflicting per-page tags in the snapshots.    -->
    <!-- ============================================================= -->
    <!-- No static <title> here on purpose: the per-page <title> is set by the
         <Seo> component and baked into every route by the prerender step.
         A static one would produce a duplicate <title> in each snapshot. -->
    <meta name="author" content="Vishwa Anandh" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#818CF8" />

    <!-- Preload the hero sequence's first visible frame so it paints as soon
         as possible, in parallel with the JS bundle. -->
    <link rel="preload" as="image" href="/sequence/frame_100_delay-0.067s.webp" fetchpriority="high" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='star-grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23818CF8'/%3E%3Cstop offset='100%25' stop-color='%23C084FC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23star-grad)' d='M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168-7.334-3.856-7.334 3.856 1.4-8.168-5.934-5.787 8.2-1.192z'/%3E%3C/svg%3E"
    />

    <!-- ============================================================= -->
    <!-- STRUCTURED DATA (JSON-LD) — GEO / AEO / Citations             -->
    <!-- Static so every crawler & AI engine reads it without running  -->
    <!-- JavaScript. This is the primary entity graph for the site.    -->
    <!-- The sameAs URLs (LinkedIn, Behance) let Google's Knowledge     -->
    <!-- Graph and AI answer engines verify and cite this person.       -->
    <!-- Keep them in sync with src/lib/seo.ts.                         -->
    <!-- ============================================================= -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://vishwaanandh.netlify.app/#person",
          "name": "Vishwa Anandh",
          "givenName": "Vishwa",
          "familyName": "Anandh",
          "url": "https://vishwaanandh.netlify.app/",
          "email": "mailto:Anandhvishwa12@gmail.com",
          "telephone": "+91-9150281870",
          "jobTitle": "Product Designer",
          "description": "Product Designer specializing in AI-native systems and complex enterprise workflows, translating technical complexity into intuitive, scalable digital experiences.",
          "knowsAbout": [
            "UI/UX Design",
            "Product Design",
            "AI-Native Systems",
            "Design Systems",
            "Enterprise UX",
            "Data Visualization",
            "Figma",
            "Prototyping",
            "Brand Identity"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Madurai",
            "addressRegion": "Tamil Nadu",
            "addressCountry": "IN"
          },
          "worksFor": {
            "@type": "Organization",
            "name": "Maitsys"
          },
          "sameAs": [
            "https://www.linkedin.com/in/vishwaanandh/",
            "https://www.behance.net/vishwaanandh"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://vishwaanandh.netlify.app/#website",
          "url": "https://vishwaanandh.netlify.app/",
          "name": "Vishwa Anandh — Portfolio",
          "description": "Portfolio of Vishwa Anandh, an AI-native Product & UI/UX Designer.",
          "inLanguage": "en",
          "publisher": { "@id": "https://vishwaanandh.netlify.app/#person" }
        },
        {
          "@type": "ProfilePage",
          "@id": "https://vishwaanandh.netlify.app/#profilepage",
          "url": "https://vishwaanandh.netlify.app/",
          "name": "Vishwa Anandh — AI-Native Product & UI/UX Designer",
          "isPartOf": { "@id": "https://vishwaanandh.netlify.app/#website" },
          "mainEntity": { "@id": "https://vishwaanandh.netlify.app/#person" },
          "about": { "@id": "https://vishwaanandh.netlify.app/#person" },
          "inLanguage": "en"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
